{{ define "main" }}
<article class="section">
  <header class="mb-3">
    <h1 class="mb-1">{{ .Title }}</h1>
    <div class="text-muted">
      <time datetime="{{ .Date }}">{{ .Date.Format "Jan 02, 2006" }}</time>
      {{ with .Params.author }} • {{ . }}{{ end }}
    </div>
  </header>

  <div class="content">
    {{ .Content }}
  </div>

  {{ with .Params.tags }}
    <div class="mt-3 text-muted">Tags: {{ delimit . ", " }}</div>
  {{ end }}
</article>
{{ end }}
